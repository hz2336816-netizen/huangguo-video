<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频解析播放</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
    h1 { text-align: center; font-size: 1.6rem; color: #38bdf8; }
    .input-box { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { padding: 12px 24px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #334155; }
    video, iframe { width: 100%; height: 100%; border: none; display: block; }
    #status { font-size: 14px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <h1>在线视频解析</h1>
    
    <div class="input-box">
      <input type="text" id="videoUrl" placeholder="请输入要解析的视频链接或剧集ID..." />
      <button onclick="startParse()">立即解析</button>
    </div>

    <div id="status"></div>

    <div class="player-wrap">
      <iframe id="iframePlayer" style="display:none;" allowfullscreen allow="autoplay; fullscreen"></iframe>
      <video id="videoPlayer" controls style="display:none;"></video>
    </div>
  </div>

  <script>
    async function startParse() {
      const input = document.getElementById('videoUrl').value.trim();
      const status = document.getElementById('status');
      const iframe = document.getElementById('iframePlayer');
      const video = document.getElementById('videoPlayer');

      if (!input) {
        status.innerText = '请先输入有效的链接或内容！';
        return;
      }

      status.innerText = '正在通过中转线路解析，请稍候...';
      iframe.style.display = 'none';
      video.style.display = 'none';

      const targetApi = 'https://huangguoai.com/?url=' + encodeURIComponent(input);
      // 让请求全部经由 Cloudflare 代理中转
      const proxyUrl = '/api/proxy?url=' + encodeURIComponent(targetApi);

      try {
        const res = await fetch(proxyUrl);
        const contentType = res.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const data = await res.json();
          const playUrl = data.url || data.video || data.data;
          if (playUrl) {
            status.innerText = '解析成功，正在播放';
            video.src = playUrl;
            video.style.display = 'block';
            video.play();
          } else {
            status.innerText = '正在载入中转播放页面...';
            iframe.src = proxyUrl;
            iframe.style.display = 'block';
          }
        } else {
          // 目标返回网页时，iframe 也强制走代理中转，绕过本地直连与 SSL 阻断
          status.innerText = '正在载入中转播放页面...';
          iframe.src = proxyUrl;
          iframe.style.display = 'block';
        }
      } catch (err) {
        console.error('解析出错:', err);
        status.innerText = '直连受阻，正在通过代理窗口呈现...';
        iframe.src = proxyUrl;
        iframe.style.display = 'block';
      }
    }
  </script>
</body>
</html>
